name: Build Final APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Create Android Project
      run: |
        mkdir -p app/src/main/java/com/mlbb/app
        mkdir -p app/src/main/res/values
        
        # 1. File build.gradle (root)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
        # 2. File app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.mlbb.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.mlbb.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF
        
        # 3. File AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="MLBB AI" android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 4. File MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/mlbb/app/MainActivity.kt
        package com.mlbb.app
        import android.app.Activity
        import android.os.Bundle
        import android.webkit.WebView
        import android.webkit.WebViewClient
        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val webView = WebView(this)
                webView.webViewClient = WebViewClient()
                webView.settings.javaScriptEnabled = true
                // LINK AI STUDIO KAMU
                webView.loadUrl("https://aistudio.google.com/apps/be4bf8f9-06f2-4e8c-baa6-980d6c041e04")
                setContentView(webView)
            }
        }
        EOF
        
        # 5. File settings.gradle
        echo "rootProject.name = 'MLBBApp'" > settings.gradle
        echo "include ':app'" >> settings.gradle
        
        # 6. File pengaturan SDK
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    - name: Build APK with Gradle
      run: |
        # Download Gradle dan build tanpa wrapper
        curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
        unzip -q gradle.zip
        ./gradle-8.2/bin/gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MLBB-Final-APK
        path: app/build/outputs/apk/debug/app-debug.apk
